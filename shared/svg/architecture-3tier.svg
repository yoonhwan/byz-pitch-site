<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 600" width="800" height="600"
  role="img" aria-labelledby="arch-svg-title arch-svg-desc"
  style="font-family: 'Courier New', monospace; background: transparent;">
  <title id="arch-svg-title">BYZ-Agents 3-Tier 분산 아키텍처</title>
  <desc id="arch-svg-desc">
    Gateway(FastAPI) — Redis Stream/Pub-Sub — Worker(LangGraph) — Shared 공통 모듈 — Client(Next.js) 로 구성된
    3-Tier 분산 아키텍처. Gateway와 Worker는 직접 연결 없이 Redis를 통해서만 통신한다.
  </desc>

  <!-- Background gradient -->
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0f1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0d1526;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="gatewayGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#1e3a5f;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#0f2040;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="workerGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#2d1b4e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#1a0f30;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="redisGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#4a1a1a;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2d0f0f;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="clientGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" style="stop-color:#0f3a2d;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#072015;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <marker id="arrowBlue" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#00d4ff" />
    </marker>
    <marker id="arrowPurple" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#a855f7" />
    </marker>
    <marker id="arrowGreen" markerWidth="8" markerHeight="8" refX="6" refY="3" orient="auto">
      <path d="M0,0 L0,6 L8,3 z" fill="#00e5a0" />
    </marker>
  </defs>

  <!-- Background -->
  <rect width="800" height="600" fill="url(#bgGrad)" rx="12"/>

  <!-- Title -->
  <text x="400" y="36" text-anchor="middle" fill="#00d4ff" font-size="18" font-weight="bold" filter="url(#glow)">
    BYZ-Agents — 3-Tier 분산 아키텍처
  </text>
  <text x="400" y="56" text-anchor="middle" fill="#4a6080" font-size="11">
    Gateway ↔ Redis ↔ Worker | 직접 의존 금지
  </text>

  <!-- === Tier 1: Gateway === -->
  <g id="gateway-tier" aria-label="Tier 1: Gateway — API 진입점">
    <rect x="40" y="80" width="220" height="180" rx="10" fill="url(#gatewayGrad)"
      stroke="#00d4ff" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="150" y="106" text-anchor="middle" fill="#00d4ff" font-size="13" font-weight="bold">Gateway (FastAPI)</text>
    <text x="150" y="122" text-anchor="middle" fill="#4a8acc" font-size="10">API 진입점</text>
    <line x1="60" y1="132" x2="240" y2="132" stroke="#00d4ff" stroke-width="0.5" stroke-opacity="0.3"/>

    <text x="60" y="152" fill="#8ab4cc" font-size="10">▸ HTTP / SSE / WebSocket</text>
    <text x="60" y="168" fill="#8ab4cc" font-size="10">▸ FastAPI + JWT 인증</text>
    <text x="60" y="184" fill="#8ab4cc" font-size="10">▸ 라우팅 / 크레딧 검증</text>
    <text x="60" y="200" fill="#8ab4cc" font-size="10">▸ Redis Pub/Sub 발행</text>
    <text x="60" y="218" fill="#4a6080" font-size="9">gateway/ BC</text>
    <text x="60" y="234" fill="#4a6080" font-size="9">ASGI · uvicorn</text>
  </g>

  <!-- === Tier 2: Redis (center) === -->
  <g id="redis-tier" aria-label="Tier 2: Redis — Stream 및 Pub/Sub 미들웨어">
    <rect x="300" y="110" width="200" height="150" rx="10" fill="url(#redisGrad)"
      stroke="#ff6b6b" stroke-width="1.5" stroke-opacity="0.7"/>
    <text x="400" y="136" text-anchor="middle" fill="#ff8888" font-size="13" font-weight="bold">Redis 7.0+</text>
    <text x="400" y="152" text-anchor="middle" fill="#cc5555" font-size="10">통신 브로커</text>
    <line x1="320" y1="162" x2="480" y2="162" stroke="#ff6b6b" stroke-width="0.5" stroke-opacity="0.3"/>

    <text x="320" y="180" fill="#cc8888" font-size="10">▸ Stream: stt_pulse_requests</text>
    <text x="320" y="196" fill="#cc8888" font-size="10">▸ Pub/Sub: room_events</text>
    <text x="320" y="212" fill="#cc8888" font-size="10">▸ 화자 Lock / 방 상태</text>
    <text x="320" y="228" fill="#cc8888" font-size="10">▸ 크레딧 관리</text>
    <text x="320" y="248" fill="#804040" font-size="9">XADD / XREAD / PUBLISH / SUBSCRIBE</text>
  </g>

  <!-- === Tier 2: Worker === -->
  <g id="worker-tier" aria-label="Tier 2: Worker — LangGraph 처리 엔진">
    <rect x="540" y="80" width="220" height="180" rx="10" fill="url(#workerGrad)"
      stroke="#a855f7" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="650" y="106" text-anchor="middle" fill="#c084fc" font-size="13" font-weight="bold">Worker (LangGraph)</text>
    <text x="650" y="122" text-anchor="middle" fill="#8b5cf6" font-size="10">처리 엔진</text>
    <line x1="560" y1="132" x2="740" y2="132" stroke="#a855f7" stroke-width="0.5" stroke-opacity="0.3"/>

    <text x="560" y="152" fill="#b08acc" font-size="10">▸ PulseStreamConsumer</text>
    <text x="560" y="168" fill="#b08acc" font-size="10">▸ STT → Assemble → Translate</text>
    <text x="560" y="184" fill="#b08acc" font-size="10">▸ Polish → Redis 발행</text>
    <text x="560" y="200" fill="#b08acc" font-size="10">▸ build_pulse_graph(LangGraph)</text>
    <text x="560" y="218" fill="#6040a0" font-size="9">worker/ BC</text>
    <text x="560" y="234" fill="#6040a0" font-size="9">Python 3.11+ · async</text>
  </g>

  <!-- === Tier 3: Shared === -->
  <g id="shared-tier" aria-label="Shared 공통 모듈">
    <rect x="300" y="300" width="200" height="100" rx="10" fill="#0d1a26"
      stroke="#4a6080" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="400" y="324" text-anchor="middle" fill="#8ab4cc" font-size="12" font-weight="bold">Shared (공통 모듈)</text>
    <line x1="320" y1="334" x2="480" y2="334" stroke="#4a6080" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="320" y="352" fill="#506070" font-size="10">▸ Pydantic 스키마</text>
    <text x="320" y="368" fill="#506070" font-size="10">▸ 환경설정 (pydantic-settings)</text>
    <text x="320" y="384" fill="#506070" font-size="10">▸ 공통 유틸리티</text>
  </g>

  <!-- === Tier 4: Client === -->
  <g id="client-tier" aria-label="Client — Next.js 15 웹 애플리케이션">
    <rect x="200" y="450" width="400" height="110" rx="10" fill="url(#clientGrad)"
      stroke="#00e5a0" stroke-width="1.5" stroke-opacity="0.6"/>
    <text x="400" y="474" text-anchor="middle" fill="#00e5a0" font-size="13" font-weight="bold">Client (Next.js 15 + TypeScript)</text>
    <text x="400" y="490" text-anchor="middle" fill="#00a870" font-size="10">브라우저 UI</text>
    <line x1="220" y1="500" x2="580" y2="500" stroke="#00e5a0" stroke-width="0.5" stroke-opacity="0.3"/>
    <text x="220" y="518" fill="#50a080" font-size="10">▸ RealtimeStation (싱글 통역)</text>
    <text x="420" y="518" fill="#50a080" font-size="10">▸ useRealtimeSolo / useRealtimeStt</text>
    <text x="220" y="534" fill="#50a080" font-size="10">▸ RealtimeRoomStation (멀티 통역)</text>
    <text x="420" y="534" fill="#50a080" font-size="10">▸ PTT · MediaRecorder · EventSource</text>
    <text x="220" y="550" fill="#304840" font-size="9">React 19 · Web Audio API · Spring motion</text>
  </g>

  <!-- === Arrows: Gateway ↔ Redis === -->
  <line x1="260" y1="170" x2="298" y2="170" stroke="#00d4ff" stroke-width="1.5"
    stroke-dasharray="4,2" marker-end="url(#arrowBlue)" opacity="0.8"/>
  <line x1="298" y1="185" x2="260" y2="185" stroke="#ff6b6b" stroke-width="1.5"
    stroke-dasharray="4,2" marker-end="url(#arrowBlue)" opacity="0.8"/>

  <text x="279" y="163" text-anchor="middle" fill="#00d4ff" font-size="8" opacity="0.9">XADD</text>
  <text x="279" y="196" text-anchor="middle" fill="#ff6b6b" font-size="8" opacity="0.9">SUB</text>

  <!-- === Arrows: Redis ↔ Worker === -->
  <line x1="502" y1="170" x2="538" y2="170" stroke="#ff6b6b" stroke-width="1.5"
    stroke-dasharray="4,2" marker-end="url(#arrowPurple)" opacity="0.8"/>
  <line x1="538" y1="185" x2="502" y2="185" stroke="#a855f7" stroke-width="1.5"
    stroke-dasharray="4,2" marker-end="url(#arrowPurple)" opacity="0.8"/>

  <text x="520" y="163" text-anchor="middle" fill="#ff6b6b" font-size="8" opacity="0.9">XREAD</text>
  <text x="520" y="196" text-anchor="middle" fill="#a855f7" font-size="8" opacity="0.9">PUB</text>

  <!-- === Arrows: Gateway → Shared === -->
  <line x1="150" y1="260" x2="150" y2="360" stroke="#4a6080" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="150" y1="360" x2="298" y2="360" stroke="#4a6080" stroke-width="1"
    stroke-dasharray="3,3" marker-end="url(#arrowBlue)" opacity="0.5"/>

  <!-- === Arrows: Worker → Shared === -->
  <line x1="650" y1="260" x2="650" y2="360" stroke="#4a6080" stroke-width="1" stroke-dasharray="3,3" opacity="0.5"/>
  <line x1="650" y1="360" x2="502" y2="360" stroke="#4a6080" stroke-width="1"
    stroke-dasharray="3,3" marker-end="url(#arrowPurple)" opacity="0.5"/>

  <!-- === Arrows: Redis → Client (SSE/WS via Gateway) === -->
  <line x1="400" y1="260" x2="400" y2="298" stroke="#ff6b6b" stroke-width="1.5" stroke-dasharray="4,2" opacity="0.6"/>
  <line x1="400" y1="298" x2="400" y2="298" stroke="#ff6b6b" stroke-width="1.5" opacity="0.6"/>
  <line x1="400" y1="400" x2="400" y2="448" stroke="#00e5a0" stroke-width="1.5"
    stroke-dasharray="4,2" marker-end="url(#arrowGreen)" opacity="0.8"/>

  <text x="415" y="316" fill="#4a6080" font-size="8" opacity="0.8">room_events</text>
  <text x="415" y="436" fill="#00e5a0" font-size="8" opacity="0.9">SSE / WS</text>

  <!-- No-direct connection notice -->
  <text x="400" y="72" text-anchor="middle" fill="#4a3a1a" font-size="10">
    ※ gateway ↔ worker 직접 의존 금지 — Redis Stream/Pub-Sub 이벤트로만 통신
  </text>

  <!-- Legend -->
  <g aria-label="범례">
    <text x="40" y="580" fill="#4a6080" font-size="9">범례:</text>
    <line x1="75" y1="576" x2="95" y2="576" stroke="#00d4ff" stroke-width="1.5" stroke-dasharray="4,2"/>
    <text x="98" y="579" fill="#4a6080" font-size="9">데이터 흐름 (XADD/SUB)</text>
    <line x1="220" y1="576" x2="240" y2="576" stroke="#4a6080" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="243" y="579" fill="#4a6080" font-size="9">모듈 의존성</text>
  </g>
</svg>
